<title>ColourmotionDMX Main Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* UX-01 sketch, iteration 2 — built from specs/ux/research.md ("Design brief for iteration 2").
   Layout: status strip / workspace rail · fixed 2x2 window grid · function buttons, keypad, softkeys /
   attribute bar / pages · playback strips · cue-list Go block · GM. Zones never reflow.
   Colour means state only: red programmer, blue selection, green running, amber fading/warning,
   cyan from palette, violet blind. Attribute-group hues are muted tags only. */
:root {
  --bg: #121314; --surf: #1a1c1e; --surf2: #222427; --line: #2a2c2f; --line2: #3a3d41;
  --fg: #d8dadc; --fg2: #8a8e93; --fg3: #55595e;
  --red: #e5484d; --blue: #3e8ef7; --green: #46a758; --amber: #f5a524; --cyan: #3fb7d9; --violet: #8e4ec6;
  --gI: #bdb38c; --gP: #8fa3b5; --gC: #b58fa8; --gG: #8fb59c; --gB: #b59e8f; --gE: #9c8fb5; --gS: #8f9396; --gFX: #b5a98f;
  --chassis: #08090a; --panel: #16181a;
  --f-leg: "IBM Plex Sans Condensed", "SF Pro Display", "Arial Narrow", sans-serif;
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --f-num: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, monospace;
  color-scheme: dark;
}
.app.day { --chassis: #c4c7cb; --panel: #dfe1e3; --bg: #e9eaeb; --surf: #f7f7f8; --surf2: #ffffff; --line: #c9cbce; --line2: #a9acb0; --fg: #111213; --fg2: #4d5156; --fg3: #9a9ea3;
  --red: #d1242f; --blue: #0b63d6; --green: #1f7a35; --amber: #b36b00; --cyan: #0a7ea4; color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #08090a; color: #d8dadc; font: 12px/1.3 var(--f-ui); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

.app { height: 100%; display: grid; background: var(--bg); color: var(--fg); user-select: none; -webkit-user-select: none;
  grid-template-columns: 78px minmax(0, 1fr) auto; grid-template-rows: 26px minmax(0, 1fr) 64px 232px;
  grid-template-areas: "status status status" "rail grid side" "attr attr attr" "play play play"; gap: 5px; background: var(--chassis); }
.app > * { background: var(--bg); min-width: 0; min-height: 0; }
.app.blind { box-shadow: inset 0 0 0 3px var(--violet); }

/* status strip */
.status { grid-area: status; display: flex; align-items: center; gap: 14px; padding: 0 10px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--fg2); white-space: nowrap; overflow: hidden; }
.status b { font: 600 12px var(--f-leg); color: var(--fg); letter-spacing: .02em; }
.st { display: inline-flex; align-items: center; gap: 5px; }
.st i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg3); }
.st.ok i { background: var(--green); }
.tagx { padding: 1px 6px; border-radius: 2px; font: 600 10px var(--f-num); letter-spacing: .08em; }
.tag-blind { background: var(--violet); color: #fff; }
.tag-dbo { background: var(--amber); color: #000; }
.status .sp { flex: 1; }
.status button { padding: 2px 7px; border: 1px solid var(--line); border-radius: 2px; font-size: 11px; color: var(--fg2); }
.status button.on { color: var(--fg); border-color: var(--fg2); }
.clock { font: 11px var(--f-num); color: var(--fg); }

/* rail */
.rail { grid-area: rail; display: flex; flex-direction: column; gap: 1px; padding: 4px; border-right: 1px solid var(--line); overflow: auto; }
.rail button { min-height: 44px; padding: 5px 6px; border-radius: 2px; text-align: left; font: 500 12px/1.1 var(--f-leg); color: var(--fg2); display: flex; flex-direction: column; gap: 2px; }
.rail button small { font: 9px var(--f-num); color: var(--fg3); }
.rail button:hover:not(:disabled) { background: var(--surf); color: var(--fg); }
.rail button.on { background: var(--surf2); color: var(--fg); box-shadow: inset 2px 0 0 var(--fg); }
.rail button:disabled { opacity: .35; }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* window grid */
.grid { grid-area: grid; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px; background: var(--line); }
.win { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.win > header { flex: none; display: flex; align-items: baseline; gap: 8px; height: 22px; padding: 4px 8px 0; border-bottom: 1px solid var(--line); }
.win > header h2 { margin: 0; font: 600 12px var(--f-leg); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.win > header span { font: 10px var(--f-num); color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win > header .r { margin-left: auto; }
.wb { flex: 1; overflow: auto; padding: 3px; min-height: 0; }
.cells { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; }
.trow { grid-column: 1 / -1; font: 500 10px var(--f-leg); letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); padding: 4px 2px 1px; }

/* one button anatomy for fixtures, groups and palettes */
.cell { position: relative; height: 54px; border-radius: 2px; background: var(--surf); box-shadow: inset 0 0 0 1px var(--line); text-align: left; overflow: hidden; }
.cell:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--line2); }
.cell .num { position: absolute; top: 4px; left: 4px; font: 10px var(--f-num); color: var(--fg2); font-variant-numeric: tabular-nums; }
.cell .kind { position: absolute; top: 4px; right: 4px; font: 500 9px var(--f-num); color: var(--fg2); letter-spacing: .06em; }
.cell .lg { position: absolute; left: 4px; right: 4px; bottom: 9px; font: 500 12px/1.05 var(--f-leg); max-height: 26px; overflow: hidden; }
.cell .ic { position: absolute; top: 16px; left: 4px; right: 4px; height: 12px; display: flex; align-items: center; }
.cell .sw { height: 8px; width: 100%; border-radius: 1px; }
.cell .mask { position: absolute; left: 3px; right: 3px; bottom: 2px; display: flex; gap: 1px; }
.cell .mask i { flex: 1; height: 3px; background: var(--line); }
.cell.empty { background: transparent; }
.cell.empty .num { color: var(--fg3); }
.cell.dim { opacity: .38; }
.cell.sel { box-shadow: inset 0 0 0 2px var(--blue); }
.cell.sel .num { color: var(--blue); }
.cell.inprog::before, .cell.lit::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--red); }
.cell.src { box-shadow: inset 0 0 0 2px var(--amber); }
.armed .cell.empty:not(:disabled) .num { color: var(--red); }
.cell .ord { position: absolute; top: 4px; right: 4px; font: 600 10px var(--f-num); color: var(--blue); }
.cell .lamp { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 4px; border-radius: 1px; background: #000; box-shadow: inset 0 0 0 1px var(--line); }
.cell .loc { position: absolute; top: 17px; right: 4px; font: 600 9px var(--f-num); color: var(--fg2); }
.cell.cur { box-shadow: inset 0 0 0 2px var(--blue), inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--blue); }

/* tables: programmer, cue list, active */
table.t { width: 100%; border-collapse: collapse; font: 11px var(--f-num); font-variant-numeric: tabular-nums; }
.t th { text-align: left; font: 500 10px var(--f-leg); letter-spacing: .08em; color: var(--fg3); padding: 2px 4px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
.t td { padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td.n { color: var(--fg2); width: 34px; }
.t .man { color: var(--red); }
.t .pal { color: var(--cyan); }
.t .off { color: var(--fg3); }
.t tr.cur td { box-shadow: inset 0 1px 0 var(--green), inset 0 -1px 0 var(--green); }
.t tr.cur td:first-child { box-shadow: inset 3px 0 0 var(--green), inset 0 1px 0 var(--green), inset 0 -1px 0 var(--green); }
.t tr.next td.n { color: var(--green); }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--surf); }
.note { color: var(--fg2); padding: 8px; margin: 0; font-size: 12px; max-width: 46ch; }
.dotc { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 4px; vertical-align: -1px; }

/* colour picker window */
.picker { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px; height: 100%; }
.picker canvas { width: 100%; height: 100%; min-height: 80px; border-radius: 2px; cursor: crosshair; touch-action: none; }
.mix { display: flex; flex-direction: column; gap: 3px; }
.mrow { display: grid; grid-template-columns: 14px 1fr 26px; align-items: center; gap: 4px; font: 10px var(--f-num); color: var(--fg2); }
.mbar { height: 14px; background: var(--surf); box-shadow: inset 0 0 0 1px var(--line); position: relative; cursor: ew-resize; touch-action: none; }
.mbar i { position: absolute; inset: 0 auto 0 0; }
.gels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-top: 4px; }
.gel { height: 28px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--line); font: 9px var(--f-num); text-align: left; padding: 3px; display: flex; flex-direction: column; justify-content: space-between; }
.gel i { height: 5px; border-radius: 1px; display: block; }

/* side: function buttons, keypad, softkeys */
.side { grid-area: side; display: flex; gap: 5px; background: var(--chassis); }
.side > div { background: var(--bg); padding: 4px; display: grid; gap: 2px; align-content: start; overflow: auto; }
.func { grid-template-columns: repeat(2, 68px); grid-template-rows: 24px; grid-auto-rows: 40px; }
.func .k { text-align: left; padding: 0 7px; font-size: 13px; box-shadow: inset 0 0 0 1px var(--line), inset 0 -2px 0 var(--line2); }
.kp { grid-template-columns: repeat(4, 50px); grid-template-rows: 24px; grid-auto-rows: 38px; background: var(--panel) !important; }
.kp .k { background: var(--surf2); box-shadow: inset 0 0 0 1px var(--line2); border-radius: 3px; }
.kp .k.cmdk { background: var(--bg); color: var(--fg2); font-size: 11px; }
.kp .k.ent { background: var(--fg); color: var(--bg); }
.kp.hide { display: none !important; }
.soft { grid-template-columns: 112px; grid-template-rows: 24px; grid-auto-rows: minmax(44px, 1fr); align-content: stretch !important; }
.k { height: 40px; border-radius: 2px; background: var(--surf); box-shadow: inset 0 0 0 1px var(--line); font: 500 12px/1.05 var(--f-leg); text-align: center; padding: 0 3px; }
.k:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--line2); }
.k:active:not(:disabled) { background: var(--fg); color: var(--bg); }
.k:disabled { opacity: .3; }
.k.on { box-shadow: inset 0 0 0 2px var(--fg); }
.k.rec.on { box-shadow: inset 0 0 0 2px var(--red); color: var(--red); }
.k.blind.on { box-shadow: inset 0 0 0 2px var(--violet); color: #c9a3ef; }
.k.clr.has { box-shadow: inset 0 0 0 2px var(--red); color: var(--red); }
.k.num { font: 18px var(--f-num); }
.kp .k { height: 38px; }
.hd2 { grid-column: 1 / -1; font: 600 11px var(--f-leg); letter-spacing: .1em; color: var(--fg2); text-transform: uppercase; padding: 2px 2px 4px; margin-bottom: 2px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.soft { background: var(--panel) !important; }
.sk { position: relative; border-radius: 2px; background: var(--surf2); box-shadow: none; clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); text-align: left; padding: 6px 8px 6px 28px; font: 500 12px/1.15 var(--f-leg); }
.sk b { position: absolute; left: 14px; top: 6px; font: 600 11px var(--f-num); color: var(--fg3); }
.sk small { display: block; font: 10px var(--f-num); color: var(--fg2); margin-top: 2px; }
.sk:disabled { opacity: .3; }
.sk.warn { background: var(--red); color: #fff; }
.sk.warn b, .sk.warn small { color: #fff; }
.sk input { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line2); border-radius: 2px; font: 12px var(--f-leg); padding: 3px 4px; user-select: text; }

/* attribute bar */
.attr { grid-area: attr; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 0 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tabs { display: grid; grid-template-columns: repeat(8, 30px); gap: 2px; }
.tab { position: relative; height: 34px; border-radius: 2px; background: var(--surf); box-shadow: inset 0 0 0 1px var(--line); font: 600 13px var(--f-leg); color: var(--fg2); }
.tab::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 3px; height: 2px; background: var(--gc); opacity: .7; }
.tab.av { color: var(--fg); }
.tab.on { background: var(--fg); color: var(--bg); }
.tab.has::before { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--red); }
.tab:disabled { opacity: .3; }
.wheels { display: flex; gap: 6px; align-items: center; }
.modes { display: flex; flex-direction: column; gap: 2px; }
.modes button { height: 16px; padding: 0 5px; border-radius: 2px; font: 9px var(--f-num); color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line); }
.modes button.on { color: var(--bg); background: var(--fg); }
.wh { width: 168px; flex: none; height: 46px; border-radius: 2px; background: var(--surf); box-shadow: inset 0 0 0 1px var(--line); position: relative; cursor: ew-resize; touch-action: none; overflow: hidden; }
.wh .nm { position: absolute; top: 4px; left: 6px; font: 500 11px var(--f-leg); letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.wh .bk { position: absolute; top: 4px; right: 6px; font: 9px var(--f-num); color: var(--fg3); }
.wh .vl { position: absolute; top: 17px; left: 6px; right: 6px; font: 500 15px var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wh.man .vl { color: var(--red); }
.wh.pal .vl { color: var(--cyan); }
.wh .roll { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background-image: repeating-linear-gradient(90deg, var(--line2) 0 1px, transparent 1px 6px); background-position-x: var(--x, 0); }
.wh .pos { position: absolute; bottom: 0; height: 8px; width: 2px; background: var(--fg); left: var(--p, 0%); }
.wheels.many .wh { width: 124px; }
.wh.none { cursor: default; }
.wh.none .vl { color: var(--fg3); }
.cmdz { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cmd { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 2px; background: #0b0c0d; box-shadow: inset 0 0 0 1px var(--line); font: 13px var(--f-num); color: var(--fg); overflow: hidden; white-space: nowrap; }
.app.day .cmd { background: #fff; }
.cmd .pr { color: var(--fg3); }
.cmd .curs { width: 7px; height: 14px; background: var(--fg2); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.msg { font-size: 11px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.warn { color: var(--amber); }
.pz { display: flex; gap: 4px; align-items: stretch; }
.pz .sum { display: flex; flex-direction: column; justify-content: center; padding: 0 8px; font: 11px var(--f-num); color: var(--fg2); min-width: 108px; }
.pz .sum b { font-weight: 500; color: var(--red); font-size: 13px; }
.pz .sum.empty b { color: var(--fg3); }
.pz .k { height: 46px; width: 60px; }

/* playback zone */
.play { grid-area: play; display: grid; grid-template-columns: 64px minmax(0, 1fr) 210px 70px; gap: 5px; background: var(--chassis); }
.play > div { background: var(--bg); min-width: 0; }
.pages { display: flex; flex-direction: column; gap: 2px; padding: 4px; }
.pages button { height: 30px; border-radius: 2px; font: 500 11px/1 var(--f-leg); text-align: left; padding: 0 5px; color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line); }
.pages button.on { color: var(--bg); background: var(--fg); }
.pages .pg-n { font: 10px var(--f-num); display: block; margin-bottom: 2px; }
.pages select { margin-top: auto; background: var(--surf); color: var(--fg); border: 1px solid var(--line); border-radius: 2px; font: 10px var(--f-num); padding: 2px; }
.pages label { font: 9px var(--f-num); color: var(--fg3); }
.strips { display: flex; gap: 2px; padding: 4px; overflow-x: auto; }
.bank { display: flex; gap: 2px; position: relative; padding: 13px 3px 3px; box-shadow: inset 0 0 0 1px var(--line2); border-radius: 2px; }
.bank > span { position: absolute; top: 1px; left: 5px; font: 9px var(--f-num); color: var(--fg2); letter-spacing: .06em; }
.loose { display: flex; gap: 2px; padding-top: 13px; }
.strip { position: relative; width: 92px; flex: none; display: grid; grid-template-rows: 44px minmax(0, 1fr) 24px 24px; gap: 2px; padding: 2px; border-radius: 2px; background: var(--surf); box-shadow: inset 0 0 0 1px var(--line); }
.strip.sel { box-shadow: inset 0 0 0 2px var(--blue); }
.strip.run::after, .strip.rel::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 0; height: 3px; background: var(--green); }
.strip.rel::after { background: var(--amber); }
.strip.empty { background: transparent; }
.leg { position: relative; text-align: left; padding: 6px 5px 3px; background: var(--bg); border-radius: 1px; overflow: hidden; }
.leg::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--halo, transparent); }
.leg .ln { display: block; font: 500 12px/1.05 var(--f-leg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leg .mt { display: block; font: 9px var(--f-num); color: var(--fg2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.armed .strip .leg { box-shadow: inset 0 0 0 1px var(--red); }
.lvl { position: relative; background: var(--bg); border-radius: 1px; cursor: ns-resize; touch-action: none; overflow: hidden; }
.lvl .bar { position: absolute; left: 0; right: 0; bottom: 0; background: var(--line2); }
.strip.run .lvl .bar { background: color-mix(in srgb, var(--green) 40%, var(--surf)); }
.lvl .cap { position: absolute; left: 0; right: 0; height: 2px; background: var(--fg); }
.lvl .pc { position: absolute; top: 3px; right: 4px; font: 11px var(--f-num); font-variant-numeric: tabular-nums; }
.lvl .fp { position: absolute; left: 0; bottom: 0; width: 3px; background: var(--green); }
.fb { border-radius: 1px; background: var(--surf2); box-shadow: inset 0 0 0 1px var(--line); font: 500 11px var(--f-leg); letter-spacing: .06em; text-transform: uppercase; touch-action: none; }
.fb.held { background: var(--fg); color: var(--bg); }
.fb.latched { box-shadow: inset 0 0 0 2px var(--amber); color: var(--amber); }
.fb:disabled { opacity: .25; }

.go { display: grid; grid-template-rows: auto auto minmax(0, 1fr) 30px; gap: 4px; padding: 6px; }
.go .hd { display: flex; justify-content: space-between; gap: 6px; font: 10px var(--f-num); color: var(--fg2); white-space: nowrap; }
.go .now { font: 500 13px var(--f-leg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go .now span { font: 12px var(--f-num); color: var(--green); margin-right: 6px; }
.gob { position: relative; border-radius: 2px; background: var(--surf); box-shadow: inset 0 0 0 2px var(--green); text-align: left; padding: 8px 10px; overflow: hidden; }
.gob:active:not(:disabled) { background: var(--green); }
.gob .g { display: block; font: 600 24px/1 var(--f-leg); letter-spacing: .12em; color: var(--green); }
.gob:active:not(:disabled) .g { color: var(--bg); }
.gob .nx { display: block; margin-top: 6px; font: 500 12px var(--f-leg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gob .nx span { font: 11px var(--f-num); color: var(--fg2); }
.gob .fpb { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--green); }
.gob:disabled { box-shadow: inset 0 0 0 1px var(--line); }
.gob:disabled .g { color: var(--fg3); }
.gorow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.gorow .k { height: 30px; font-size: 11px; }
.gm { display: grid; grid-template-rows: 18px minmax(0, 1fr) 30px; gap: 3px; padding: 4px; }
.gm .ln { font: 500 11px var(--f-leg); text-align: center; color: var(--fg2); }
.gm.low .lvl .bar { background: color-mix(in srgb, var(--amber) 45%, var(--surf)); }
.fb.dbo.on { background: var(--amber); color: #000; box-shadow: none; }

@media (max-width: 1280px) { .kp { display: none !important; } }
@media (max-width: 900px) {
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "status" "rail" "grid" "side" "attr" "play"; padding: 0 16px; }
  .status, .rail { flex-wrap: wrap; flex-direction: row; white-space: normal; padding-block: 6px; }
  .rail button { min-height: 36px; }
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .win { height: 300px; }
  .side { flex-wrap: wrap; } .soft { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; flex: 1; }
  .attr { grid-template-columns: minmax(0, 1fr); padding-block: 6px; } .wheels { flex-wrap: wrap; }

<script>
// UX-01 sketch. Fake engine: the merge below only lights the tiles; real behaviour is specced in ENG/PRG/PAL/PBK/CUE.
// ---------------------------------------------------------------- rig (the church, PROJECT.md)
const TYPES = {
  wash: { label: "Washes 19×15 W RGBW", short: "Wash", attrs: ["dim", "str", "pan", "tilt", "col", "w", "zoom"] },
  rgbw: { label: "Pars RGBW", short: "RGBW", attrs: ["dim", "str", "col", "w"] },
  rgbl: { label: "Pars RGB+Lime", short: "RGB+L", attrs: ["dim", "col", "l"] },
  rgb:  { label: "Pars RGB · virtual dimmer", short: "RGB", attrs: ["dim", "col"] },
  spot: { label: "Front spots", short: "Spot", attrs: ["dim"] },

const FIX = [];
const add = (type, n, from) => { for (let i = 0; i < n; i++) FIX.push({ id: from + i, type, name: `${TYPES[type].short} ${from + i}` }); };
add("wash", 4, 101); add("rgbw", 8, 201); add("rgbl", 6, 211); add("rgb", 6, 221); add("spot", 6, 301);
const F = Object.fromEntries(FIX.map(f => [f.id, f]));
const has = (f, a) => TYPES[f.type].attrs.includes(a);

  { name: "All", ids: pick(() => true) }, { name: "Washes", ids: WASH }, { name: "All pars", ids: PARS },
  { name: "Pars RGBW", ids: pick(f => f.type === "rgbw") }, { name: "Odd pars", ids: PARS.filter((_, i) => i % 2 === 0) },
  { name: "Even pars", ids: PARS.filter((_, i) => i % 2 === 1) }, { name: "Front spots", ids: SPOT }, { name: "Stage wash", ids: [...WASH, ...PARS] },
];
const GROUP_OF = { dim: "I", str: "I", pan: "P", tilt: "P", col: "C", w: "C", l: "C", zoom: "B" };
const AG = ["I", "P", "C", "G", "B", "E", "S", "FX"];
const AG_NAME = { I: "Intensity", P: "Position", C: "Colour", G: "Gobo (none in this rig)", B: "Beam", E: "Effect (none in this rig)", S: "Special (none in this rig)", FX: "Shapes (phase 2)" };

// ---------------------------------------------------------------- colour: one target colour (P1-07)
const C = (r, g, b) => ({ r, g, b });

const clamp = v => Math.max(0, Math.min(1, v));

const GELS = [["L201", "Full CT Blue", C(.6, .75, 1)], ["L079", "Just Blue", C(.1, .3, 1)], ["L181", "Congo Blue", C(.25, 0, .65)], ["L106", "Primary Red", C(1, 0, .05)],
  ["L135", "Deep Golden Amber", C(1, .35, 0)], ["L010", "Medium Yellow", C(1, .85, .1)], ["L116", "Medium Blue-Green", C(0, .75, .6)], ["L128", "Bright Pink", C(1, .1, .55)]];

// ---------------------------------------------------------------- show data
const look = (fids, v) => Object.fromEntries(fids.map(id => [id, Object.fromEntries(Object.entries(v).filter(([a]) => has(F[id], a)))]));
const merge = (...ls) => Object.assign({}, ...ls);
const WARM = C(1, .72, .42), BLUE = C(.1, .3, 1), DEEP = C(.05, .05, .8);
const CUES = [
  { n: 1, name: "Walk-in", t: 3, d: 0, look: look(PARS, { dim: .45, col: WARM }) },
  { n: 2, name: "Welcome", t: 2, d: 0, look: merge(look(PARS, { dim: .6, col: WARM }), look(SPOT, { dim: .8 })) },
  { n: 3, name: "Worship", t: 4, d: 0, look: merge(look(PARS, { dim: .7, col: BLUE }), look(WASH, { dim: .8, col: C(.8, 0, 1), pan: .5, tilt: .3 })) },
  { n: 4, name: "Prayer", t: 6, d: 1, look: look(PARS, { dim: .3, col: DEEP }) },
  { n: 5, name: "Sermon", t: 3, d: 0, look: merge(look(PARS, { dim: .35, col: WARM }), look(SPOT, { dim: 1 })) },
  { n: 6, name: "Video", t: 2, d: 0, look: look(PARS, { dim: .15, col: DEEP }) },
  { n: 7, name: "Walk-out", t: 5, d: 0, look: look(PARS, { dim: .6, col: WARM }) },
];
const pb = (name, l, extra) => ({ name, look: l, opts: { mode: 0, prio: "Normal", rmask: "I", rtime: 2 }, ...extra });
const PAGES = [
  { name: "Sunday", pbs: [pb("Service", null, { list: true }), pb("Warm wash", look(PARS, { dim: .8, col: WARM })), pb("Front spots", look(SPOT, { dim: 1 })),
    pb("Blue wash", merge(look(PARS, { dim: .7, col: BLUE }), look(WASH, { dim: .7, col: BLUE }))), pb("Washes stage", look(WASH, { dim: 1, col: C(1, 1, 1), pan: .5, tilt: .4, zoom: .6 })),
    pb("Purple", look(PARS, { dim: .7, col: C(.55, 0, 1) })), pb("House", look(PARS, { dim: 1, col: C(1, 1, 1) })), null] },
  { name: "Band", pbs: [pb("Red", look([...PARS, ...WASH], { dim: .8, col: C(1, 0, 0) })), pb("Cyan", look([...PARS, ...WASH], { dim: .8, col: C(0, .9, 1) })),
    pb("Washes band", look(WASH, { dim: 1, pan: .3, tilt: .6 })), null, null, null, null, null] },
  { name: "", pbs: [] }, { name: "", pbs: [] },
];
let nextPb = 1;
PAGES.forEach(pg => pg.pbs.forEach(p => { if (p) p.id = nextPb++; }));

const mkPal = (name, kind, v) => ({ name, kind, ...v });
const SLOTS = 32, BASE = { C: 1, P: 41, B: 81 };
const PAL = { C: Array(SLOTS).fill(null), P: Array(SLOTS).fill(null), B: Array(SLOTS).fill(null) };
[["White", C(1, 1, 1)], ["Warm", WARM], ["Amber", C(1, .5, .05)], ["Red", C(1, 0, 0)], ["Magenta", C(1, 0, .6)], ["Purple", C(.55, 0, 1)], ["Deep blue", DEEP], ["Blue", BLUE],
 ["Cyan", C(0, .9, 1)], ["Green", C(0, 1, .2)], ["Lime", C(.6, 1, 0)], ["Pink", C(1, .45, .7)]].forEach(([n, c], i) => PAL.C[i] = mkPal(n, "G", { all: { col: c } }));
[["Stage", .5, .4], ["Pulpit", .38, .45], ["Band", .62, .5], ["Audience", .5, .75], ["Cross", .5, .2], ["Ceiling", .5, .05]].forEach(([n, pan, tilt], i) =>
  PAL.P[i] = mkPal(n, "N", { byFix: Object.fromEntries(WASH.map((id, k) => [id, { pan: pan + (k - 1.5) * .04, tilt }])) }));
[["Zoom narrow", "S", { byType: { wash: { zoom: .1 } } }], ["Zoom mid", "S", { byType: { wash: { zoom: .5 } } }], ["Zoom wide", "S", { byType: { wash: { zoom: .95 } } }],
 ["Full", "G", { all: { dim: 1 } }], ["Half", "G", { all: { dim: .5 } }], ["Out", "G", { all: { dim: 0 } }]].forEach(([n, k, v], i) => PAL.B[i] = mkPal(n, k, v));
const MASK = { C: ["col", "w", "l"], P: ["pan", "tilt"], B: ["dim", "str", "zoom"] };
const MASK_TXT = { C: "C", P: "P", B: "IGBES" };
const WIN_TITLE = { C: "Colours", P: "Positions", B: "Gobos & Beams" };
const palVals = (p, f) => p.all || p.byType?.[f.type] || p.byFix?.[f.id];
const palGroups = p => new Set((p.all ? [p.all] : Object.values(p.byType || p.byFix)).flatMap(v => Object.keys(v).map(a => GROUP_OF[a])));
const palNum = (w, i) => BASE[w] + i;

// ---------------------------------------------------------------- state
const S = {
  ws: 0, sel: [], cur: -1, changed: false, prog: {}, located: {}, group: "C", cmode: "HSI",
  mode: null, src: null, target: null, ctx: null, recMerge: false, fan: null, high: false, blind: false,
  page: 0, fpp: 8, gm: 1, dbo: false, cue: 0, fade: null, level: { 1: 1 }, raised: { 1: 1 }, order: 1, rel: {},
  flash: null, swop: null, latched: {}, selPb: 1, cmd: [], keys: false, kp: true, day: false,
  undo: [], msg: "Service runs Q1 Walk-in on playback 1. Pick a group to start programming.", warn: false,
};
const allPbs = () => PAGES.flatMap(pg => pg.pbs.filter(Boolean));
const pbById = id => allPbs().find(p => p.id === +id);
const lookOf = p => p.list ? CUES[S.cue].look : p.look;
const lvl = p => (S.flash === p.id || S.swop === p.id || S.latched[p.id]) ? 1 : (S.level[p.id] || 0);
const say = (t, warn) => { S.msg = t; S.warn = !!warn; };

function snapshot(label) {
  S.undo.push({ label, s: JSON.stringify({ prog: S.prog, sel: S.sel, located: S.located, PAL, pages: PAGES.map(pg => pg.pbs) }) });
  if (S.undo.length > 30) S.undo.shift();
}
function undo() {
  const u = S.undo.pop(); if (!u) return say("Nothing to undo.");
  const d = JSON.parse(u.s);
  S.prog = d.prog; S.sel = d.sel; S.located = d.located; S.cur = -1;
  for (const w of ["C", "P", "B"]) PAL[w] = d.PAL[w];
  d.pages.forEach((pbs, i) => PAGES[i].pbs = pbs);
  say(`Undone: ${u.label}`);
}

// ---------------------------------------------------------------- fake output (only to light the tiles)
function output(f) {
  const o = { dim: 0, col: C(1, 1, 1), w: 0, l: 0, pan: .5, tilt: .5, zoom: .5 };
  if (S.located[f.id]) o.dim = 1;
  const live = allPbs().filter(p => lvl(p) > 0).sort((a, b) => (S.raised[a.id] || 0) - (S.raised[b.id] || 0));
  for (const p of live) {
    const v = lookOf(p)?.[f.id]; if (!v) continue;
    if (v.dim != null) o.dim = Math.max(o.dim, v.dim * lvl(p));
    for (const a of ["col", "w", "l", "pan", "tilt", "zoom"]) if (v[a] != null) o[a] = v[a];
  }
  if (S.swop && !lookOf(pbById(S.swop))?.[f.id]) o.dim = 0;
  const pr = S.prog[f.id];
  if (pr && !S.blind) for (const a of ["dim", "col", "w", "l", "pan", "tilt", "zoom"]) if (pr[a] != null) o[a] = pr[a];
  if (S.high && S.sel.includes(f.id) && (S.cur < 0 || S.sel[S.cur] === f.id)) { o.dim = 1; o.col = C(1, 1, 1); }
  o.dim *= S.dbo ? 0 : S.gm;
  return o;
}

// ---------------------------------------------------------------- programmer actions
function selectFix(list, toggle) {
  if (S.changed) { S.sel = []; S.changed = false; }
  S.cur = -1;
  for (const id of list) { const i = S.sel.indexOf(id); if (i >= 0 && toggle) S.sel.splice(i, 1); else if (i < 0) S.sel.push(id); }
}
const touch = id => S.prog[id] || (S.prog[id] = { ref: {} });
const targets = () => S.cur >= 0 ? [S.sel[S.cur]] : S.sel;
const FAN = { Line: x => x * 2 - 1, Mirror: x => 1 - Math.abs(x * 2 - 1) * 2, Wings: x => (x < .5 ? x : x - .5) * 4 - 1, Arrow: x => Math.abs(x * 2 - 1) * 2 - 1 };

  let n = 0;
  ids.forEach((id, i) => {
    const f = F[id]; if (!has(f, a)) return;
    const pr = touch(id), k = S.fan && ids.length > 1 ? FAN[S.fan](i / (ids.length - 1)) : 1;
    pr[a] = fn(pr[a] ?? output(f)[a] ?? 0, k); delete pr.ref[GROUP_OF[a]]; n++;

}

    for (const [a, val] of Object.entries(v)) if (has(F[id], a)) { const pr = touch(id); pr[a] = typeof val === "object" ? { ...val } : val; pr.ref[GROUP_OF[a]] = p.name; hit = true; }

}
function recordPal(w, i) {
  const mask = MASK[w];

  if (!fids.length) return say(`Nothing in the programmer for ${WIN_TITLE[w]} (mask ${MASK_TXT[w]}).`, true);
  const vals = id => Object.fromEntries(mask.filter(a => S.prog[id][a] != null).map(a => [a, S.prog[id][a]]));
  const key = id => JSON.stringify(vals(id));

  const types = [...new Set(fids.map(id => F[id].type))];
  let p;
  if (w !== "P" && fids.every(id => key(id) === key(fids[0]))) p = mkPal("", "G", { all: vals(fids[0]) });
  else if (w !== "P" && types.every(t => { const ts = fids.filter(id => F[id].type === t); return ts.every(id => key(id) === key(ts[0])); }))
    p = mkPal("", "S", { byType: Object.fromEntries(types.map(t => [t, vals(fids.find(id => F[id].type === t))])) });

  PAL[w][i] = p; S.mode = null;

const progLook = () => Object.fromEntries(Object.entries(S.prog).map(([id, pr]) => [id, Object.fromEntries(["dim", "col", "w", "l", "pan", "tilt", "zoom"].filter(a => pr[a] != null).map(a => [a, pr[a]]))]));

}

  if (!S.sel.length) S.sel = Object.keys(l).map(Number);

// ---------------------------------------------------------------- command line (Titan keypad syntax subset)
function key(k) {
  const t = S.cmd, last = t[t.length - 1];
  if (/^[0-9.]$/.test(k)) { if (last && /^[0-9.]+$/.test(last)) t[t.length - 1] = last + k; else t.push(k); return; }
  if (k === "Back") { if (last && /^[0-9.]{2,}$/.test(last)) t[t.length - 1] = last.slice(0, -1); else t.pop(); return; }
  if (k === "Enter") return exec();
  if (k === "Exit") { S.cmd = []; S.mode = null; S.src = null; S.target = null; S.ctx = null; return say("Exit."); }
  t.push(k);
}
function exec() {
  const t = S.cmd; if (!t.length) return;
  const text = t.join(" ");
  S.cmd = [];
  let kind = null, list = [], at = null;
  for (let i = 0; i < t.length; i++) {
    const x = t[i];
    if (["Fixture", "Group", "Palette", "Macro"].includes(x)) kind = x;
    else if (x === "@") { at = t[i + 1] == null ? 100 : +t[i + 1]; i++; }
    else if (x === "Thro") { const a = list.pop() ?? 0, b = +t[i + 1]; for (let n = Math.min(a, b); n <= Math.max(a, b); n++) list.push(n); i++; }
    else if (/^[0-9.]+$/.test(x)) list.push(+x);
  }
  kind = kind || "Fixture";
  if (list.length) {
    if (kind === "Macro") return say("Macros come later; the key stays so muscle memory does not change.", true);
    if (kind === "Fixture") { const ids = list.filter(n => F[n]); if (!ids.length) return say(`${text}: no such fixture.`, true); selectFix(ids, false); }
    if (kind === "Group") { const g = GROUPS[list[0] - 1]; if (!g) return say(`${text}: no such group.`, true); selectFix(g.ids, false); }
    if (kind === "Palette") {
      const n = list[0], w = n >= BASE.B ? "B" : n >= BASE.P ? "P" : "C", i = n - BASE[w];
      if (!PAL[w][i]) return say(`${text}: palette ${n} is empty.`, true);
      applyPal(w, i);
    }
  }
  if (at != null) {
    if (!S.sel.length) return say(`${text}: select fixtures first.`, true);
    snapshot(text);
    const n = setAttr(targets(), "dim", () => clamp(at / 100));
    say(`${text} → intensity on ${n} fixtures.`);
  } else if (kind !== "Palette") say(`${text} → ${S.sel.length} selected.`);
}

// ---------------------------------------------------------------- function buttons, softkeys
const FUNCS = [
  ["Record", "rec"], ["Update"], ["Edit"], ["Select If", "later"], ["Delete"], ["Unfold", "later"], ["Copy"], ["Move"], ["Include"], ["Release"],

];
const MODE_HINT = {
  Record: "Record: tap an empty palette button (mask from its window) or a playback legend.",
  Update: "Update: tap the palette to update with what is in the programmer.",
  Edit: "Edit: tap a playback or palette to load it into the programmer.",
  Delete: "Delete: tap the palette or playback to delete. You confirm on softkey A.",
  Copy: "Copy: tap the source palette, then an empty button.", Move: "Move: tap the source palette, then an empty button.",
  Include: "Include: tap a playback or palette; its values go into the programmer.",
  Release: "Release: tap a playback to release it with its release time.",
  Options: "Options: tap a playback; its options appear on the softkeys.",
  Latch: "Latch: tap a Flash button to latch it on (tap again to unlatch).",
  Legend: "Set Legend: tap a palette, group or playback; type the name on softkey A.",

function func(name) {
  const def = FUNCS.find(f => f[0] === name);
  if (def?.[1] === "screen") return say(`${name} opens its own full screen (not part of this main-screen sketch).`);
