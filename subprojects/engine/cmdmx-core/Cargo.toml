[package]
name = "cmdmx-core"
description = "ColourmotionDMX engine core: data model, programmer, palettes, playback engine, HTP/LTP merge. Pure, deterministic, no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }

# PAL-23's show test reads the top-level keys of a parsed show in file order.
[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
