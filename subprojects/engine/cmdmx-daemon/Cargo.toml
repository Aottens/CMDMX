[package]
name = "cmdmx-daemon"
description = "ColourmotionDMX engine daemon: owns the tick loop, DMX output, MIDI and the show file. The only crate with I/O."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cmdmx-daemon"
path = "src/main.rs"

[dependencies]
cmdmx-core = { path = "../cmdmx-core" }
cmdmx-protocols = { path = "../cmdmx-protocols" }
cmdmx-control = { path = "../cmdmx-control" }
serialport = { version = "4.10.1", default-features = false }
tungstenite = "0.30"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# CTL-08: CoreMIDI. Only on macOS, so CI on Linux needs no ALSA headers.
[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"
# CTL-16: the MIDI thread runs its run loop so CoreMIDI sees devices that appear later.
core-foundation-sys = "0.8.7"
# CTL-44, ADR-009: Stream Decks over USB HID. macOS only, so the Linux CI needs no libudev.
hidapi = { version = "2.6", default-features = false }

# CTL-53: SIGINT and SIGTERM blank the decks before the daemon exits.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# PAT-11, PAT-15..18: the church patch from the Lightkey export, run once (VS2-13).
[[example]]
name = "church"
test = true

[lints]
workspace = true
