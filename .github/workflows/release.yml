name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: DMG (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version (REL-01)
        id: v
        run: |
          version=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(bash subprojects/app/scripts/release-version.sh "$GITHUB_REF_NAME")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # subprojects/engine/rust-toolchain.toml says `stable`; make-dmg.sh runs rustup target add there too.
      - run: swift --version
      - run: subprojects/engine/scripts/fetch-qlcplus.sh
      - run: subprojects/app/scripts/make-dmg.sh "${{ steps.v.outputs.version }}" "${{ github.run_number }}"
      - run: subprojects/app/scripts/check-dmg.sh "subprojects/app/.build/CMDMX-${{ steps.v.outputs.version }}.dmg" "${{ steps.v.outputs.version }}"
      - name: GitHub release (REL-09)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "subprojects/app/.build/CMDMX-${{ steps.v.outputs.version }}.dmg" \
            --title "CMDMX ${{ steps.v.outputs.version }}" \
            --notes-file subprojects/app/scripts/release-notes.md
      - name: Keep the DMG as workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: CMDMX-${{ steps.v.outputs.version }}.dmg
          path: subprojects/app/.build/CMDMX-${{ steps.v.outputs.version }}.dmg

  # A release made with GITHUB_TOKEN does not start other workflows, so the page is called from here.
  website:
    name: Website (WEB-21)
    needs: dmg
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
