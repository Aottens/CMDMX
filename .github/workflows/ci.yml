name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  tracking:
    name: tracking (BACKLOG, IDEAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q --depth=1 origin main
      - name: tracking summary (shown on the run page)
        run: set -o pipefail; scripts/check-tracking.py --summary origin/main | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  engine:
    name: engine (Rust)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subprojects/engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subprojects/engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: daemon smoke run
        run: cargo run -q -p cmdmx-daemon -- --ticks 20

  app:
    name: app (Swift, macOS)
    if: github.event.action != 'edited'
    runs-on: macos-14
    defaults:
      run:
        working-directory: subprojects/app
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: scripts/bundle-app.sh debug
