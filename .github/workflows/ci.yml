name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subprojects/engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subprojects/engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: release tag check (REL-01)
        working-directory: .
        run: bash subprojects/app/scripts/test-release-tag.sh
      - name: no old product name in living files (BRD-01)
        working-directory: .
        run: scripts/check-brand.sh
      - name: TouchOSC layout is up to date
        working-directory: .
        run: python3 touchosc/generate.py --check
      - name: TouchOSC layout checks
        working-directory: .
        run: python3 touchosc/test_generate.py
      - name: daemon smoke run
        run: cargo run -q -p cmdmx-daemon -- --ticks 20

  firmware:
    name: firmware (Rust, RP2350)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subprojects/hardware/firmware
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subprojects/hardware/firmware
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy -p cmdmx-box --target thumbv8m.main-none-eabihf -- -D warnings
      - run: cargo box

  app:
    name: app (Swift, macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: subprojects/app
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: scripts/bundle-app.sh debug

  website:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: subprojects/website/test-build.sh
      - run: subprojects/website/build.sh
        env:
          GH_TOKEN: ${{ github.token }}
